version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: gestion_proyectos_backend_app
    container_name: gestion_proyectos_backend_app
    restart: unless-stopped
    ports:
      - "8085:8000"
    volumes:
      - .:/var/www
    networks:
      - gestion_network
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: gestion_db
      DB_USERNAME: gestion_user
      DB_PASSWORD: gestion_password_local
      # ── Credenciales del primer admin ──────────────────
      ADMIN_NAME: "Administrador"
      ADMIN_EMAIL: "admin@admin.com"
      ADMIN_PASSWORD: "Admin1234!"

  db:
    image: mysql:8.4
    container_name: gestion_proyectos_mysql
    restart: unless-stopped
    ports:
      - "3319:3306"
    environment:
      MYSQL_DATABASE: gestion_db
      MYSQL_ROOT_PASSWORD: root_password_local
      MYSQL_USER: gestion_user
      MYSQL_PASSWORD: gestion_password_local
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - gestion_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ugestion_user", "-pgestion_password_local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

networks:
  gestion_network:
    driver: bridge

volumes:
  dbdata:
    driver: local