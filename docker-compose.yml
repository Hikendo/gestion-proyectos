version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: gestion_proyectos_backend_app
    container_name: gestion_proyectos_backend_app
    restart: unless-stopped
    ports:
      # CAMBIO: Ahora accederás desde tu navegador usando el puerto 8085
      # Sintaxis: "PUERTO_LOCAL:PUERTO_CONTENEDOR"
      - "8085:8000"
    volumes:
      - .:/var/www
    networks:
      - gestion_network
    depends_on:
      - db

  db:
    image: mysql:8.4
    container_name: gestion_proyectos_mysql
    restart: unless-stopped
    tty: true
    ports:
      # CAMBIO: Si usas un gestor como DBeaver o TablePlus, te conectarás al puerto 3309
      - "3319:3306"
    environment:
      MYSQL_DATABASE: gestion_db
      MYSQL_ROOT_PASSWORD: root_password_local
      MYSQL_USER: gestion_user
      MYSQL_PASSWORD: gestion_password_local
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - gestion_network

networks:
  gestion_network:
    driver: bridge

volumes:
  dbdata:
    driver: local
