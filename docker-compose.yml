services:

  # ─────────────────────────────────────────────────────────────
  # PHP-FPM / Laravel (Base de la App)
  # ─────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: gestion_proyectos_backend_app
    container_name: gestion_proyectos_backend_app
    restart: unless-stopped
    expose:
      - "9000"
    volumes:
      - ./backend:/var/www
    networks:
      - gestion_network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "php", "-r", "exit(fsockopen('127.0.0.1', 9000) ? 0 : 1);" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 60s
    # 💡 Usamos un alias (&laravel-env) para reutilizar estas variables abajo
    environment: &laravel-env
      APP_ENV: local
      APP_DEBUG: "true"
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: gestion_db
      DB_USERNAME: gestion_user
      DB_PASSWORD: gestion_password_local
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ADMIN_NAME: "Administrador"
      ADMIN_EMAIL: "admin@admin.com"
      ADMIN_PASSWORD: "Admin1234!"

  # ─────────────────────────────────────────────────────────────
  # LARAVEL HORIZON (Dedicated Queue Container)
  # ─────────────────────────────────────────────────────────────
  horizon:
    image: gestion_proyectos_backend_app
    container_name: gestion_proyectos_horizon
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
    command: [ "php", "artisan", "horizon" ]
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - gestion_network
    environment: *laravel-env # 👈 Hereda la configuración de base de datos y Redis automáticamente

  # ─────────────────────────────────────────────────────────────
  # LARAVEL SCHEDULER (Dedicated Cron Container)
  # ─────────────────────────────────────────────────────────────
  scheduler:
    image: gestion_proyectos_backend_app
    container_name: gestion_proyectos_scheduler
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
    command: [ "php", "artisan", "schedule:work" ]
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - gestion_network
    environment: *laravel-env # 👈 Requerido para ejecutar tareas programadas en la BD

  # ─────────────────────────────────────────────────────────────
  # NGINX (Tu Proxy / Servidor Web)
  # ─────────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: gestion_proyectos_nginx
    restart: unless-stopped
    ports:
      - "8000:80" # 👈 Tu API principal sigue aquí
      - "8001:8001" # 👈 NUEVO: Puerto exclusivo para Horizon
    volumes:
      - ./backend:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - gestion_network

  # ─────────────────────────────────────────────────────────────
  # FRONTEND VITE (Vue 3)
  # ─────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gestion_proyectos_frontend_app
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_BASE_URL: /api/v1
      VITE_BACKEND_PROXY: http://nginx
    depends_on:
      - nginx
    networks:
      - gestion_network

  # ─────────────────────────────────────────────────────────────
  # LARAVEL REVERB (WebSocket Server)
  # ─────────────────────────────────────────────────────────────
  reverb:
    image: gestion_proyectos_backend_app
    container_name: gestion_proyectos_reverb
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
    command: [ "php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080" ]
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - gestion_network
    environment: *laravel-env

  # ─────────────────────────────────────────────────────────────
  # REDIS
  # ─────────────────────────────────────────────────────────────
  redis:
    image: redis:8.0-alpine
    container_name: gestion_proyectos_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - gestion_network

  # ─────────────────────────────────────────────────────────────
  # MYSQL
  # ─────────────────────────────────────────────────────────────
  db:
    image: mysql:8.4
    container_name: gestion_proyectos_mysql
    restart: unless-stopped
    ports:
      - "3319:3306"
    environment:
      MYSQL_DATABASE: gestion_db
      MYSQL_ROOT_PASSWORD: root_password_local
      MYSQL_USER: gestion_user
      MYSQL_PASSWORD: gestion_password_local
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - gestion_network
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

networks:
  gestion_network:
    driver: bridge

volumes:
  dbdata:
    driver: local
  redisdata:
    driver: local
  frontend_node_modules:
    driver: local
