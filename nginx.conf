# ─────────────────────────────────────────────────────────────
# CONFIGURACIÓN EXISTENTE (Puerto 80 -> Mapeado al 8000 externo)
# ─────────────────────────────────────────────────────────────
server {
    listen 80;
    root /var/www/public;
    index index.php index.html;
    
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/public$fastcgi_script_name;
    }
}

# ─────────────────────────────────────────────────────────────
# NUEVA CONFIGURACIÓN: Servidor exclusivo para Horizon (Puerto 8001)
# ─────────────────────────────────────────────────────────────
server {
    listen 8001; # 👈 Escucha en el puerto 8001
    root /var/www/public;
    index index.php;

    # Forzar que cualquier petición que entre por aquí vaya directo a Horizon
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass backend:9000; # 👈 Envía el procesamiento al contenedor de PHP
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/public$fastcgi_script_name;
    }
}