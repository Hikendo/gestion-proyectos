# ─────────────────────────────────────────────────────────────
# CONFIGURACIÓN EXISTENTE (Puerto 80 -> Mapeado al 8000 externo)
# ─────────────────────────────────────────────────────────────
# ─────────────────────────────────────────────────────────────
# Docker DNS resolver (forces re-resolution when containers restart)
# ─────────────────────────────────────────────────────────────
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    root /var/www/public;
    index index.php index.html;
    
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        set $backend_upstream backend:9000;
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass $backend_upstream;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/public$fastcgi_script_name;
    }
}

# ─────────────────────────────────────────────────────────────
# NUEVA CONFIGURACIÓN: Servidor exclusivo para Horizon (Puerto 8001)
# ─────────────────────────────────────────────────────────────
server {
    listen 8001; # 👈 Escucha en el puerto 8001
    root /var/www/public;
    index index.php;

    # Forzar que cualquier petición que entre por aquí vaya directo a Horizon
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        set $backend_upstream_horizon backend:9000;
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass $backend_upstream_horizon; # 👈 DNS dinámico con variable
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/public$fastcgi_script_name;
    }
}
