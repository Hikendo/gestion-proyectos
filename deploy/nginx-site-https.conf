# ══════════════════════════════════════════════════════════════
# nginx host — SITIO HTTPS (definitivo)
#   • Puerto 80  → redirige a HTTPS (y sirve ACME para renovación)
#   • Puerto 443 → estáticos del frontend + proxy API + Reverb (wss)
# Tokens: __DOMAIN__ __WWW__
# ══════════════════════════════════════════════════════════════

# ── 80 → 443 ──────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;

    server_name __DOMAIN____WWW__;

    # Let's Encrypt HTTP-01 (renovación automática)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── 443 HTTPS ─────────────────────────────────────────────────
server {
    # NOTA: la directiva 'http2 on;' requiere nginx >= 1.25.1; en nginx 1.24
    # (Ubuntu) NO existe y rompe 'nginx -t'. Se usa el parámetro http2 en
    # 'listen', válido en 1.24+ (deprecado con warning en 1.25.1+, pero funcional).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name __DOMAIN____WWW__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root /opt/gestion-proyectos/frontend/dist;
    index index.html;

    client_max_body_size 50m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA (Vue Router history mode)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API Laravel → contenedor nginx (127.0.0.1:8000) → PHP-FPM
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Laravel Horizon (dashboard opcional) → 127.0.0.1:8001
    location /horizon/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Laravel Reverb (WebSockets, protocolo Pusher en /app)
    # El frontend conecta a wss://__DOMAIN__/app (Laravel Echo)
    location /app {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}
