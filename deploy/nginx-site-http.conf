# ══════════════════════════════════════════════════════════════
# nginx host — SITIO HTTP (temporal / para Let's Encrypt)
# Sirve el dist/ del frontend y proxifica la API al contenedor.
# Se reemplaza por nginx-site-https.conf tras emitir el certificado.
# Tokens: __DOMAIN__ __WWW__
# ══════════════════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;

    server_name __DOMAIN____WWW__;

    root /opt/gestion-proyectos/frontend/dist;
    index index.html;

    client_max_body_size 50m;

    # Let's Encrypt HTTP-01 (lo usa certbot con --webroot)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # SPA (Vue Router history mode)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API Laravel → contenedor nginx (127.0.0.1:8000)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket Reverb (se usa si aún no hay HTTPS: ws://host:8080)
    # Cuando hay HTTPS el tráfico wss://DOMINIO/app entra por el 443.
}
