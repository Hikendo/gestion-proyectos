# ══════════════════════════════════════════════════════════════
# DOCKER COMPOSE DE PRODUCCIÓN — "Gestión de Proyectos"
# ─────────────────────────────────────────────────────────────
# Archivo COMPLETO e independiente (no es un overlay): no levanta
# el frontend de Vite ni expone MySQL al exterior.
#
# En el servidor (dentro de /opt/gestion-proyectos):
#
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml exec -T backend php artisan migrate --force
#
# Variables usadas (fichero .env del mismo directorio o entorno):
#   DOMAIN  DB_DATABASE  DB_USERNAME  DB_PASSWORD  DB_ROOT_PASSWORD
# ══════════════════════════════════════════════════════════════

services:

  # ─────────────────────────────────────────────────────────────
  # PHP-FPM / Laravel (Base de la App)
  # ─────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: gestion_proyectos_backend_app
    container_name: gestion_proyectos_backend_app
    restart: unless-stopped
    expose:
      - "9000"
    volumes:
      - ./backend:/var/www
    networks:
      - gestion_network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "php", "-r", "exit(fsockopen('127.0.0.1', 9000) ? 0 : 1);" ]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 300s
    environment: &laravel-env
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "https://${DOMAIN}"
      SESSION_DOMAIN: ".${DOMAIN}"
      LOG_LEVEL: warning
      # Driver explícito: evita que Laravel caiga al default `sqlite` si el
      # .env no queda legible por www-data en runtime. Las variables de
      # `environment:` son reales y NO las sobreescribe el .env.
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-gestion_db}"
      DB_USERNAME: "${DB_USERNAME:-gestion_user}"
      DB_PASSWORD: "${DB_PASSWORD:-gestion_proyectos_db_2026}"
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ADMIN_NAME: "Administrador"
      ADMIN_EMAIL: "admin@admin.com"
      ADMIN_PASSWORD: "Admin1234!"

  # ─────────────────────────────────────────────────────────────
  # LARAVEL HORIZON (Cola de trabajo dedicada)
  # ─────────────────────────────────────────────────────────────
  horizon:
    image: gestion_proyectos_backend_app
    container_name: gestion_proyectos_horizon
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
    command: [ "php", "artisan", "horizon" ]
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - gestion_network
    environment: *laravel-env

  # ─────────────────────────────────────────────────────────────
  # LARAVEL SCHEDULER (Contenedor cron dedicado)
  # ─────────────────────────────────────────────────────────────
  scheduler:
    image: gestion_proyectos_backend_app
    container_name: gestion_proyectos_scheduler
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
    command: [ "php", "artisan", "schedule:work" ]
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - gestion_network
    environment: *laravel-env

  # ─────────────────────────────────────────────────────────────
  # NGINX contenedor (sirve la API a PHP-FPM).
  # Solo escucha en 127.0.0.1:8000 / 8001; el tráfico público
  # entra por el nginx del host (HTTPS).
  # ─────────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: gestion_proyectos_nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:80"
      - "127.0.0.1:8001:8001"
    volumes:
      - ./backend:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - gestion_network

  # ─────────────────────────────────────────────────────────────
  # LARAVEL REVERB (WebSocket). También solo en 127.0.0.1:8080;
  # el nginx host proxifica /app (wss) hacia este puerto.
  # ─────────────────────────────────────────────────────────────
  reverb:
    image: gestion_proyectos_backend_app
    container_name: gestion_proyectos_reverb
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
    command: [ "php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080" ]
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - gestion_network
    environment: *laravel-env

  # ─────────────────────────────────────────────────────────────
  # REDIS
  # ─────────────────────────────────────────────────────────────
  redis:
    image: redis:8.0-alpine
    container_name: gestion_proyectos_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - gestion_network

  # ─────────────────────────────────────────────────────────────
  # MYSQL (sin puerto público: solo se usa dentro de la red Docker)
  # ─────────────────────────────────────────────────────────────
  db:
    image: mysql:8.4
    container_name: gestion_proyectos_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-gestion_db}"
      MYSQL_USER: "${DB_USERNAME:-gestion_user}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-gestion_proyectos_db_2026}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-gestion_proyectos_root_2026}"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - gestion_network
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

networks:
  gestion_network:
    driver: bridge

volumes:
  dbdata:
    driver: local
  redisdata:
    driver: local
